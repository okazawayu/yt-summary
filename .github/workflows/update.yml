name: update-summaries

on:
  # 定期起動は外部（cron-job.org）から workflow_dispatch で毎時行う。GitHub の schedule は間引かれて不安定なため使わない
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["web/**", "channels.json", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest scripts/test_update.py

      - name: Fetch and summarize
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
          MAX_SECONDS: ${{ vars.MAX_SECONDS }}
          REQUEST_INTERVAL: ${{ vars.REQUEST_INTERVAL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/update.py

      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 別の実行が先にコミットしていても要約を失わないよう、動画単位でマージしてから push する
          for i in 1 2 3; do
            git fetch -q origin main
            git show origin/main:data/videos.json > /tmp/theirs.json 2>/dev/null || echo '{"videos":[]}' > /tmp/theirs.json
            python scripts/merge_data.py data/videos.json /tmp/theirs.json data/videos.json
            git reset -q --mixed origin/main
            git add data/
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data: update summaries $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "push rejected, retrying ($i)"; sleep 5
          done
          exit 1

      - name: Build site
        run: |
          # 待機中に別の実行が要約データをコミットしている場合があるので、最新の data/ を取り直す
          git fetch --depth=1 origin main && git checkout origin/main -- data/ || true
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/videos.json _site/data/ 2>/dev/null || echo '{"videos":[],"channels":[]}' > _site/data/videos.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
